# Builds the app and runs the checks on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and a debug build
        run: |
          chmod +x gradlew
          ./gradlew testGithubDebugUnitTest assembleGithubDebug
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every voice line has audio
        run: python scripts/check_voices.py
      - name: The PC brain's code compiles
        run: python -m compileall -q brain scripts
      - name: The phone's safety word lists match the PC's
        run: python scripts/sync_safety_kt.py --check
      - name: The PC brain's tests (persona, safety, pairing, install)
        run: |
          pip install pytest cryptography
          python -m pytest -q brain/tests
