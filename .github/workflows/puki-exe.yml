# Builds Puki.exe (the PC brain for Windows) from this repository's source at a release tag, so
# anyone can check that the release's Puki.exe comes from this code (see docs/code-signing.html).
# The build is kept as the "Puki-exe" artifact. It isn't code-signed yet.
name: Puki.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Puki.exe
        run: python brain/build_exe.py
      - name: SHA-256
        shell: bash
        run: sha256sum brain/dist/Puki.exe
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Puki-exe
          path: brain/dist/Puki.exe
          if-no-files-found: error
